services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screenai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screenai}
      POSTGRES_DB: ${POSTGRES_DB:-screen_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screenai} -d ${POSTGRES_DB:-screen_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-screenai}:${POSTGRES_PASSWORD:-screenai}@db:5432/${POSTGRES_DB:-screen_ai}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-3}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-8}
      PERF_PROFILE: ${PERF_PROFILE:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      OUTPUT_DIR: /app/outputs
      TEMP_DIR: /app/temp
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      STRICT_STARTUP: ${STRICT_STARTUP:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    volumes:
      - api_outputs:/app/outputs
      - api_temp:/app/temp
      - api_data:/app/data
      - whisper_cache:/root/.cache
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    env_file:
      - .env.docker
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-screenai}:${POSTGRES_PASSWORD:-screenai}@db:5432/${POSTGRES_DB:-screen_ai}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-3}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-8}
      WHISPER_WARMUP: ${WHISPER_WARMUP:-true}
      PERF_PROFILE: ${PERF_PROFILE:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      OUTPUT_DIR: /app/outputs
      TEMP_DIR: /app/temp
      DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    volumes:
      - api_outputs:/app/outputs
      - api_temp:/app/temp
      - api_data:/app/data
      - whisper_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  api_outputs:
  api_temp:
  api_data:
  whisper_cache:
